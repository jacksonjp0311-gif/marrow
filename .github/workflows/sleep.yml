name: sleep
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m marrow sleep
      - run: |
          git config user.name "marrow"
          git config user.email "marrow@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "sleep"
          git push
