name: awake
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m marrow
      - run: |
          git config user.name "marrow"
          git config user.email "marrow@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "awake"
          git push
